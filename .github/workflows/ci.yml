name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  go-checks:
    name: Go vet / fmt / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go 1.23.5 (matches nakama:3.26.0 plugin builder)
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.5"
          cache: true

      - name: Go vet (lint + type-check)
        run: go vet ./...

      - name: Check formatting (gofmt)
        run: |
          fmt_out=$(gofmt -l . | grep -v vendor || true)
          if [ -n "$fmt_out" ]; then
            echo "Not formatted — run 'make fmt' or 'go fmt ./...':"
            echo "$fmt_out"
            gofmt -d $fmt_out | head -n 100
            exit 1
          fi
          echo "fmt ok"

      - name: Go test
        run: go test ./... -v

      - name: Verify go.mod tidy
        run: |
          go mod tidy
          if ! git diff --exit-code go.mod go.sum; then
            echo "go.mod/go.sum not tidy — run 'go mod tidy' and commit"
            git diff go.mod go.sum
            exit 1
          fi

  docker-build:
    name: Docker build (Go plugin)
    runs-on: ubuntu-latest
    needs: go-checks
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Nakama image (plugin)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: rummy_backend:ci

      # Optional: also verify compose builds (covers Postgres service)
      - name: Verify compose config and build
        run: |
          docker compose version
          docker compose config --quiet
          docker compose build nakama
