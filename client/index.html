<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rummy — Phaser 3 (Romanian Tile Rummy)</title>
    <style>
      body { margin: 0; background: #0a4d2e; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 12px; box-sizing: border-box; }
      #game { width: min(1024px, 96vw); height: min(768px, 72vh); max-width: 1024px; max-height: 768px; aspect-ratio: 1024 / 768; border: 2px solid #333; background: #0a4d2e; }
      #game canvas { width: 100% !important; height: 100% !important; }
      #info { position: absolute; top: 8px; left: 8px; color: #fff; font-family: monospace; font-size: 12px; background: rgba(0,0,0,0.6); padding: 8px; border-radius: 4px; max-width: 96vw; }
      @media (max-width: 768px) { #info { font-size: 10px; top: 4px; left: 4px; padding: 6px; } #game { width: 96vw; height: 72vh; } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="info">Rummy Phaser 3 — Romanian Tile Rummy — see <code>client/docs/roadmap.md</code><br/>Backend at <code>127.0.0.1:7350</code> (<code>docker compose up --build -d</code>) — <code>make cli-help</code> for CLI</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
